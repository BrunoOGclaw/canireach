name: test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  probe-instrument:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/test-robots.mjs
      - run: node tools/mutate-robots.mjs

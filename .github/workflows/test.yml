name: test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  probe-instrument:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node tools/test-robots.mjs
      - run: node tools/mutate-robots.mjs
      - run: node tools/test-probe.mjs
      - run: node tools/test-run-artifact.mjs
      - run: node tools/test-workflow.mjs

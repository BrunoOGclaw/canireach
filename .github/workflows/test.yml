name: test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  probe-instrument:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node tools/mutate-robots.mjs
      # Discovered, not listed. A new tools/test-*.mjs is enforced the moment it
      # exists; a list has to be remembered, and this one had already drifted.
      - run: |
          set -euo pipefail
          for t in tools/test-*.mjs; do
            echo "--- $t"
            node "$t"
          done
